name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docx_corpus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Load schema
        run: psql -v ON_ERROR_STOP=1 postgres://postgres:postgres@localhost:5432/docx_corpus -f db/schema.sql

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/docx_corpus
        run: bun test --coverage --coverage-reporter=lcov

      - name: Test (Python WARC fixer)
        run: python3 scripts/test_fix_trailing_warc_bytes.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5

      - name: Build
        run: bun run build

      - name: Build (site)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run --cwd apps/site build
